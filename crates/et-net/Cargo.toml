[package]
name = "et-net"
description = "TCP transport, handshake, and connection orchestration for et.rs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
crossbeam-channel = "0.5"
et-core = { path = "../et-core" }
prost = "0.13"
rustix = { version = "1.1.4", features = ["event"] }
socket2 = { version = "0.6.1", features = ["all"] }
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
privdrop = "0.5.6"
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process"] }
wait-timeout = "0.2.1"

[[bin]]
name = "et-user-socket-helper"
path = "src/bin/et_user_socket_helper.rs"
