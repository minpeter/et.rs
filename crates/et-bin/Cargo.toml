[package]
name = "et"
description = "Single telemetry-free EternalTerminal binary (Rust port)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "et"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
et-cli = { path = "../et-cli" }
et-core = { path = "../et-core" }
et-net = { path = "../et-net" }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
prost = "0.13"
wait-timeout = "0.2.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "poll"] }
rustix = { version = "1.1.4", features = ["process"] }
