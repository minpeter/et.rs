[package]
name = "et"
description = "Single telemetry-free EternalTerminal binary (Rust port)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "et"
path = "src/main.rs"

# Test-only helper: binds a real UNIX socket for the fake ssh control master.
[[bin]]
name = "mksocket"
path = "testbin/mksocket.rs"
test = false
doc = false

[lints]
workspace = true

[dependencies]
et-cli = { path = "../et-cli" }
et-core = { path = "../et-core" }
et-net = { path = "../et-net" }
et-server = { path = "../et-server" }
et-htm = { path = "../et-htm" }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
# ConPTY on Windows, forkpty on Unix.
portable-pty = "0.9.0"
prost = "0.13"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
wait-timeout = "0.2.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
rustix = { version = "1.1.4", features = ["event", "fs", "process", "time"] }
signal-hook = "0.3.18"

[target.'cfg(windows)'.dependencies]
# Ctrl+C / console shutdown signalling, the Windows analogue of SIGINT/SIGTERM.
ctrlc = "3.5"
# Safe CreateProcessW wrapper with an explicit inherited-handle allowlist.
windows-spawn = "0.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.7.0"

[target.'cfg(all(target_os = "linux", target_env = "gnu", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
jiff = { version = "0.2.35", default-features = false, features = ["tz-system", "tzdb-zoneinfo"] }

[dev-dependencies]
serde_json = "1"
socket2 = "0.6.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "poll"] }
rustix = { version = "1.1.4", features = ["process"] }
