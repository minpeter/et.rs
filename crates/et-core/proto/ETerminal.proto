syntax = "proto2";
package et;
option optimize_for = LITE_RUNTIME;

import "ET.proto";

enum TerminalPacketType {
  KEEP_ALIVE = 0;
  TERMINAL_BUFFER = 1;
  TERMINAL_INFO = 2;
  PORT_FORWARD_DESTINATION_REQUEST = 5;
  PORT_FORWARD_DESTINATION_RESPONSE = 6;
  PORT_FORWARD_DATA = 7;
  TERMINAL_USER_INFO = 8;
  TERMINAL_INIT = 9;
  JUMPHOST_INIT = 10;
  TERMINAL_CLOSE = 11;
}

enum FlowControlMode {
  NONE = 0;
  BACKPRESSURE = 1;
  DISCARD = 2;
}

message TerminalBuffer {
  optional bytes buffer = 1;
  // When true, buffer is remote stderr (raw pipe / -T sessions only).
  // Named is_stderr (not stderr): musl #defines stderr as a macro.
  optional bool is_stderr = 2 [default = false];
}

message TerminalInfo {
  optional string id = 1;
  optional int32 row = 2;
  optional int32 column = 3;
  optional int32 width = 4;
  optional int32 height = 5;
}

message PortForwardSourceRequest {
  optional SocketEndpoint source = 1;
  optional SocketEndpoint destination = 2;
  optional string environmentvariable = 3;
}

message PortForwardSourceResponse {
  optional string error = 1;
}

// Per-forwarded-socket receive window, in the style of an SSH channel window.
// A congested forwarded socket must throttle only its own sender, never the
// shared transport, whose reads also carry keepalives and every other stream.
message PortForwardWindow {
  optional int64 bytes = 1;
  optional int32 packets = 2;
}

message PortForwardDestinationRequest {
  optional SocketEndpoint destination = 1;
  optional int32 fd = 2;
  optional PortForwardWindow window = 3;
}

message PortForwardDestinationResponse {
  optional int32 clientfd = 1;
  optional int32 socketid = 2;
  optional string error = 3;
  optional PortForwardWindow window = 4;
}

message PortForwardData {
  optional bool sourcetodestination = 1;
  optional int32 socketid = 2;
  optional bytes buffer = 3;
  optional string error = 4;
  optional bool closed = 5;
  // Credit returned to the peer as this side's local socket drains.
  optional PortForwardWindow window = 6;
}

message InitialPayload {
  optional bool jumphost = 1 [default = false];
  repeated PortForwardSourceRequest reversetunnels = 2;
  map<string, string> environmentvariables = 3;
  // When true, etterminal runs `command` on pipes instead of a login pty.
  // Field 4 matches EternalTerminal #854. et.rs flow control previously used
  // this tag; it moved to field 6 so Backpressure (varint 1) is not decoded
  // as no_pty=true. PROTOCOL_VERSION stays 6.
  optional bool no_pty = 4 [default = false];
  optional string command = 5;
  optional FlowControlMode flowcontrol = 6 [default = NONE];
}

message InitialResponse {
  optional string error = 1;
}

message ConfigParams {
  optional int32 vlevel = 1;
  optional int32 minloglevel = 2;
}

message TermInit {
  repeated string environmentnames = 1;
  repeated string environmentvalues = 2;
  // Field 3 matches EternalTerminal #854 no_pty. Flow control moved to field 5
  // so it does not collide with that bool. PROTOCOL_VERSION stays 6.
  optional bool no_pty = 3 [default = false];
  optional string command = 4;
  optional FlowControlMode flowcontrol = 5 [default = NONE];
}

message TerminalUserInfo {
  optional string id = 1;
  optional string passkey = 2;
  optional int64 uid = 3;
  optional int64 gid = 4;
  optional int64 fd = 5;
}
