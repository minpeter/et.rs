name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      # prost-build (et-core) requires protoc.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - uses: Swatinem/rust-cache@v2

      # The PTY-heavy end-to-end tests are timing-sensitive on shared
      # 2-core runners; run tests sequentially for stability.
      - if: runner.os == 'Linux'
        run: cargo test --workspace -- --test-threads=1

      # Library unit tests exercise the real SCM_RIGHTS helper. Unlike the
      # Linux workspace test command, `--lib --bins` does not produce Cargo's
      # un-hashed executable, so build the shipped helper explicitly.
      - if: runner.os == 'macOS'
        run: cargo build -p et-net --bin et-user-socket-helper

      - if: runner.os == 'macOS'
        run: cargo test --workspace --lib --bins -- --test-threads=1

      # Issue #4 and the adjacent PTY/process coverage run explicitly on
      # hosted macOS without pulling in unrelated flaky network harnesses.
      - if: runner.os == 'macOS'
        run: >-
          cargo test -p et
          --test reconnect_end_to_end
          --test reconnect_outage_end_to_end
          --test server_runtime
          --test terminal_adversarial
          --test terminal_end_to_end
          --test terminal_runtime
          --test terminal_tty_qa
          -- --test-threads=1

  # Compile the shipped binary and exercise native HTM IPC and ConPTY roles.
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo build -p et

      - name: Exercise native HTM transport and panes
        run: cargo test -p et-htm -- --test-threads=1 --nocapture

      - name: Exercise HTM role startup, resize and reattach
        run: cargo test -p et --test htm_runtime -- --test-threads=1 --nocapture

  # The release matrix builds jemalloc on native ARM against musl. Ubuntu's
  # aarch64 musl GCC needs outlined atomics disabled so libgcc does not retain
  # a glibc-only __getauxval reference (jemalloc issue #2782).
  build-linux-musl:
    name: build (aarch64-unknown-linux-musl)
    runs-on: ubuntu-24.04-arm
    env:
      CFLAGS_aarch64_unknown_linux_musl: -mno-outline-atomics
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-unknown-linux-musl

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-musl

      - run: cargo build --release --locked -p et --target aarch64-unknown-linux-musl
