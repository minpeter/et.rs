[workspace]
resolver = "2"
members = [
    "crates/et-core",
    "crates/et-cli",
    "crates/et-net",
    "crates/et-server",
    "crates/et-htm",
    "crates/et-bin",
]

[workspace.package]
version = "0.0.15"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["et.rs contributors"]
repository = "https://github.com/minpeter/et.rs"
homepage = "https://github.com/minpeter/et.rs"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
