core:changelogs:
  - content: "---\npackages:\n  et:\n    type: patch\n---\n\n### Ctrl+C brings the prompt back sooner on slow and lossy links\n\nDuring a flood, `etserver` used to keep writing until the kernel refused more. That left up to about 65 KB of output unsent in the kernel, plus part of one more 32 KiB chunk already committed, and Ctrl+C could drop none of it. It now starts each chunk only when the connection has room for it, like ET C++, so output that has not started can still be dropped. `etterminal` also hands the server terminal output in 16 KiB chunks, like ET C++.\n\n`etterminal` used to read the terminal as fast as a flooding program wrote, so the program's write never paused, and Linux applies Ctrl+C only once that write ends. Another 25 to 290 KB of output still reached the screen after Ctrl+C. Now, when forwarded input interrupts the foreground job (Ctrl+C, Ctrl+\\ or Ctrl+Z with signals enabled) while output is pending, `etterminal` stops reading output until the shell takes the terminal back, for at most 10 ms. The kernel then discards the rest of the flood. This applies to the Linux terminal runtime.\n\nOn Ctrl+C, `etserver` now hands the interrupt to the terminal before it drops the output the terminal already emitted, and it drops only what was waiting before the interrupt was written. The terminal stops a flood sooner, and an echo, prompt or exit status written after Ctrl+C is never dropped.\n\nOn a lossy link (150 ms round trip, 0.5% loss each way), the prompt now comes back after Ctrl+C in about 160 ms instead of about 430 ms. On a 10 Mbit link with a 50 ms round trip, it comes back in about the same time as with ET C++ (about 465 ms, against 535 ms before).\n"
    filename: ctrl-c-slow-links.md
    v: 0.0.0
  - content: "---\npackages:\n  et:\n    type: patch\n---\n\n### `et -N` forwards answer faster, idle `-N` sessions stop waking 200 times a second, and uploads keep replay memory bounded\n\n`et -N` (and `-M`/`--ctl` sessions) passed every forwarded packet between the session thread and a separate forwarding thread, and checked for work every 5 ms even when nothing was happening. Forwarding now runs on the session thread, as it already did in interactive sessions and as it does in ET C++'s client loop. An idle session now sleeps until there is traffic or a timer, such as the keepalive, is due. On loopback, a 64-byte round trip through `-N` went from about 207 to about 163 µs, and an idle `-N` session went from about 195 wakeups per second to under 1. A single bulk upload uses about 5% less client CPU, but it now runs on one core, so on loopback it peaks about 8% lower (about 716 instead of 782 MiB/s).\n\nDuring uploads these sessions now also send delivery acknowledgements every 512 KiB and pause their forwarded sockets while 4 MiB is still unacknowledged, the same way interactive sessions do. This stops a fast upload from filling the client's replay buffer.\n"
    filename: engine-mode-no-shell.md
    v: 0.0.0
  - content: "---\npackages:\n  et:\n    type: patch\n---\n\n### Tunnelled request/response traffic no longer sends an extra packet each way per exchange\n\nOn Linux and macOS, a forwarded socket (`-L`, `-R`, `-D`) that went quiet for 50 ms returned its window credit even when only a few bytes had drained. Each small request/response exchange through a tunnel therefore cost one extra packet in each direction: thirty 64-byte round trips sent 61 packets each way, against 30 for ET C++ and OpenSSH. Credit now goes back once an eighth of the window has drained, as it already did during transfers, or as soon as the socket has written out a burst of at least 16 KiB, and those round trips send 32 packets. A peer with a smaller window gets its credit back after an eighth of its own window.\n\nThe credit for a drained burst still goes out at once because that packet also tells the sender's TCP that the burst was read. Linux announces the freed receive window by itself only once it has doubled, so without that packet a new connection's sender waited a round trip on a stale window after every burst and the receive buffer stopped growing: a 32 MiB upload over a 50 ms link then ran at about 24 instead of 33 MiB/s.\n\nOn a lossy link every extra packet is another chance of a loss, and a loss while the connection is still warming up leaves TCP with a small congestion window, so the next upload through the tunnel crawls. On a 150 ms link with 0.5% loss each way, thirty round trips cut that window in 34% of sessions before this change and in 16% now (ET C++ 14%). Every 2 MiB upload that started after such a cut ran at 0.12 to 0.24 MiB/s, against a median of 0.90 MiB/s otherwise.\n"
    filename: forward-credit-batches.md
    v: 0.0.0
  - content: "---\npackages:\n  et:\n    type: patch\n---\n\n### Port-forward uploads are faster over high-latency links\n\nEach forwarded socket may now have 4 MiB in flight (was 2 MiB) and returns credit every eighth of that window, so a single `-N -L` upload is no longer capped near 23 MiB/s on a 50 ms round trip. Older et.rs peers still negotiate the smaller window safely.\n"
    filename: forward-window-wan.md
    v: 0.0.0
  - content: "---\npackages:\n  et:\n    type: patch\n---\n\n### Idle sessions use less server memory on Linux\n\nAn idle session used to keep the memory its last burst of output had freed. The `etserver` session thread and the per-session terminal process kept it in their allocator caches, which jemalloc only trims while a thread keeps allocating. After one second without traffic, both now return that memory. A keep-alive that arrives later does not rebuild the cache, and normal traffic gets it back right away.\n\nEach terminal process also skips jemalloc's statistics tables now. Nothing reads them, and they cost every process about 120 KiB once it used the allocator's control interface.\n\nWith 50 idle sessions on loopback, private memory (USS) per session, `etserver` and terminal process together, dropped from about 840 KiB to about 680 KiB. ET C++ uses about 1240 KiB. Memory summed by RSS still looks higher for et.rs than for ET C++, because RSS counts the shared `et` binary and libc pages again in every process.\n"
    filename: idle-session-memory.md
    v: 0.0.0
  - content: "---\npackages:\n  et:\n    type: patch\n---\n\n### `et` notices a dead connection after two keep-alive intervals instead of three\n\nWhen the network path to the server silently disappears (an IP address change, a NAT dropping the connection), no error ever arrives, and `et` finds out only through keep-alives. It used to reconnect after three keep-alive intervals without hearing from the server, 15 seconds with the default `--keepalive 5`. It now works like ET C++: one interval after the last packet from the server it sends a keep-alive, and if that is still unanswered one interval later it reconnects. That is 10 seconds by default. Typing into the dead connection no longer delays this; in ET C++ it does.\n\nIdle sessions also send fewer bytes. Keep-alives only carry `et`'s 8-byte delivery acknowledgement when it tells the other side something new: on the first keep-alive of each connection, after terminal or forwarding traffic, and after every 16 keep-alives. Toward ET C++, which ignores the acknowledgement, `etserver` now sends ET C++'s empty keep-alives, and `et` does so after its first one.\n"
    filename: keepalive-fix.md
    v: 0.0.0
  - content: "---\npackages:\n  et:\n    type: patch\n---\n\n### Idle sessions send fewer keep-alives, at ET C++'s pace\n\nAn idle `et` session, interactive or `-N`, sent a keep-alive every 5 seconds. ET C++ only sends one once more than 5 whole seconds have passed, which in practice is every 6 seconds. `et` now waits the same 6 seconds (the `--keepalive` value plus one second) before it sends a probe. An idle session now sends about 2420 bytes a minute, the same as ET C++, down from about 2900. A link that stops answering is still declared dead and reconnected 10 seconds after the last packet arrived, 2 seconds sooner than ET C++. With `--keepalive 1`, `et` still probes every second.\n"
    filename: keepalive-upstream-cadence.md
    v: 0.0.0
  - content: "---\npackages:\n  et:\n    type: patch\n---\n\n### Less server CPU for terminal output\n\nOn Linux, `etterminal` now reads the terminal until it has nothing more to give, or until it has 16 KiB, before passing output to `etserver`. Before, it stopped at the first small read. On an idle machine a fast `cat` arrives in pieces of a few hundred bytes to a few KiB, so a 101 MB `cat` went to `etserver` as about 46,000 small chunks, mostly under 4 KiB, each read, encrypted and sent on its own. It now goes as about 6,800 chunks, most of them 16 KiB.\n\nFor that 101 MB `cat` on a local link, the server side (`etserver` plus `etterminal`) went from about 1.4 to 1.0 s of CPU (ET C++: about 2.4 s), below OpenSSH's `sshd-session`, and the client also uses less. Output takes slightly fewer bytes on the wire. On a busy machine the reads were already full and nothing changes. Nothing changes on the wire format, and Ctrl+C still pauses reading the terminal until the interrupt has taken effect.\n"
    filename: output-cpu.md
    v: 0.0.0
  - content: "---\npackages:\n  et:\n    type: patch\n---\n\n### Faster terminal output over high-latency links, cleaner Ctrl+C, and quicker echo during floods\n\nOn Linux, `etserver` kept at most about 512 KiB of a session's output in the kernel, which held a 50 ms round trip to about 6 MB/s. That bound is now 2 MiB, and output not yet sent is held to 32 KiB, like ET C++. At a 50 ms round trip, terminal output went from about 6 to 14 MB/s and `-N` downloads from about 9.5 to 29 MiB/s. Ctrl+C still brings the prompt back in about one round trip. With no bound at all, a fast flood would pile megabytes of output in flight that Ctrl+C cannot drop. A server running as root may raise its send buffer above `net.core.wmem_max` for this.\n\nOn Ctrl+C the server now also drops the output the remote program already wrote but `etserver` had not read yet, like ET C++. Before, that tail (often a few hundred KB) still reached the screen. An exit status in that tail still arrives. Jumphost sessions do the same. The client now drops its own unpainted output on every Ctrl+C, not only past 64 KiB, like ET C++.\n\nKeystrokes echo faster while the terminal floods. The server reads at most 256 KiB of terminal output ahead, and the client reads the connection 64 KiB at a time instead of 256 KiB, so an echo waits behind less output. During a `yes` flood, echo went from about 55 to 20 ms.\n"
    filename: output-path.md
    v: 0.0.0
  - content: "---\npackages:\n  et:\n    type: patch\n---\n\n### Echo stays fast through every output flood\n\nWhen the remote side floods the terminal (`yes`, a large `cat`) faster than the local terminal can draw, some sessions still answered keystrokes 30 to 50 ms late. The local terminal could not keep up, so output waited in the client's receive buffer, and Linux kept growing that buffer to several megabytes. On Linux, `etserver` now stops sending terminal output while an et.rs client has about 1 MiB of it that it has not yet confirmed reading, and sends more as the client confirms. The client already sends these confirmations, so nothing changes on the wire. Output held back stays on the server, where Ctrl+C still drops it. Forwarded ports and keep-alives are never held back.\n\nOver 30 sessions of a `yes` flood on a local link, no session's median echo was above 10 ms, where 5 of 30 sat between 16 and 43 ms before. The 95th percentile went from 34 to 12 ms (ET C++: 32 ms). On a slow or distant link the limit grows with the link's capacity times its round trip, which the server measures during the connection handshake, so throughput stays the same: about 14 MB/s at a 50 ms round trip.\n\nET C++ clients, and et.rs clients older than 0.0.36, do not confirm often enough to use this, and their output is sent as before. A client that stops confirming for 10 seconds, for example a terminal paused with Ctrl+S, also gets the previous behavior until it confirms again.\n"
    filename: output-window.md
    v: 0.0.0
  - content: "---\npackages:\n  et:\n    type: patch\n---\n\n### No reconnect when a paused terminal resumes during an output flood\n\nIf the local terminal stopped reading for a few seconds during a fast output flood, the client could decide the connection was dead at the moment the terminal resumed, although the server's output was still waiting to be read. It then reconnected, and the reconnect could fail while the terminal was still catching up, ending the session. The client now treats server data it has not read yet as proof that the connection is alive.\n"
    filename: paused-terminal-keepalive.md
    v: 0.0.0
  - content: "---\npackages:\n  et:\n    type: patch\n---\n\n### `et -T` and `et --command` no longer drop the end of the output and exit 0\n\nA command's last output and its exit status could go missing, and `et` then exited with code 0 as if nothing had happened. On a busy machine, about 1 in 20 runs of `et -T localhost --command \"head -c 500000000 /dev/zero\"` printed from about 1 KB to 10 MB too little. There were two causes.\n\n`etserver` closed the connection as soon as it had queued the last output. Often the client had not read it all yet. If the client then sent anything, such as its regular keepalive, the server's operating system reset the connection and threw away the output it still held. Like ET C++, `etserver` now keeps the connection open for up to a second after the command ends, and closes it as soon as the client has read everything and closed its side.\n\n`et` could also throw away output it had already received. When it sent a keepalive just as the server finished, it noticed the closed connection and discarded its unread input, including the exit status. `et` now reads everything the server sent before it treats the connection as closed. This also applies when `et` connects to an ET C++ server.\n\nWith both fixes, 400 of 400 runs of the command above delivered every byte, against 40 short runs out of 800 before.\n"
    filename: pipe-mode-output-tail.md
    v: 0.0.0
  - content: "---\npackages:\n  et:\n    type: patch\n---\n\n### A client that stops reading for a while no longer loses its session\n\nWhile connected, `etserver` and `et` kept only the newest 8 MiB of replay history, even when the other side had not received it yet. A client whose output was blocked (for example a paused terminal) while a command kept printing could fall more than 8 MiB behind; on reconnect the server reported \"client is too far behind server\" and the session was lost. Data the other side has not acknowledged is now kept up to 64 MiB, as in ET C++. History the other side has already acknowledged is still trimmed to 8 MiB, so idle and well-behaved sessions use no more memory than before.\n"
    filename: replay-backup-keeps-unacknowledged.md
    v: 0.0.0
  - content: "---\npackages:\n  et:\n    type: patch\n---\n\n### Quicker echo during output floods and no reconnect after a paused terminal\n\nWhen the remote side floods the terminal faster than the local terminal can show it, `etserver` used to send each short piece of output as its own network packet. Linux then kept growing the client's receive buffer to many megabytes, and every keystroke echo waited behind all of it. Output that is waiting to be sent is now merged into packets of up to 16 KiB, like ET C++. During a `yes` flood on a local link, the client receive buffer now stays around 400 KB instead of growing to 9 MB or more, and echo is about 6 ms at the median instead of 20 ms.\n\nIf the local terminal stopped reading for more than 5 seconds during a flood (a slow terminal, Ctrl+S, a paused pager), `etserver` decided the client was gone and dropped the connection, so the client had to reconnect before the next prompt. The server now keeps the connection while the client is still sending, and the client keeps sending keep-alives while its output is held. A client that really disappears is still dropped after 10 seconds of silence. Getting the prompt back after a 10 second pause went from about 100 ms to about 13 ms.\n\nAfter Ctrl+C during a flood, the client no longer paints the output that was already waiting in its connection when the key was pressed. The server sent that output before it could see the interrupt, and ET C++ drops output it has already read in the same way on the server. It only happens when at least 64 KiB was waiting, never touches what the server sends after the interrupt, and keeps exit status and other non-terminal packets. Output shown after Ctrl+C went from about 145 KB to about 45 KB.\n"
    filename: terminal-flood-queue.md
    v: 0.0.0
