name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Needed for `cargo update --workspace` after version bumps.
      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # With pending changelogs: bump versions and open a "Version Packages" PR.
      # After that PR merges: create the `et@x.y.z` git tag and GitHub release.
      - name: Version & release
        run: node scripts/tegami.mts ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Detect released tag
        id: tag
        run: |
          tag="$(git tag --points-at HEAD 'et@*' | head -n 1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Released: $tag"
          else
            echo "No release tag on HEAD, skipping binary build."
          fi

  binaries:
    needs: release
    if: needs.release.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # prost-build (et-core) requires protoc.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p et --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          version="${TAG#et@}"
          name="et-${version}-${{ matrix.target }}"
          mkdir "$name"
          case "${{ matrix.target }}" in
            *windows*)
              cp "target/${{ matrix.target }}/release/et.exe" "$name/"
              archive="$name.zip"
              7z a "$archive" "./$name/*"
              ;;
            *)
              cp "target/${{ matrix.target }}/release/et" "$name/"
              # Busybox-style role dispatch: symlinks select the role by argv[0].
              for role in etserver etterminal htm htmd; do
                ln -s et "$name/$role"
              done
              archive="$name.tar.gz"
              tar -czf "$archive" "$name"
              ;;
          esac
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        shell: bash
        run: |
          gh release upload "$TAG" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
