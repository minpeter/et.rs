name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing et release tag whose binary assets should be rebuilt
        required: true
        default: et@0.0.21
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: github.event_name == 'push'
        with:
          node-version: 24
          cache: npm

      # Needed for `cargo update --workspace` after version bumps.
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'push'

      - if: github.event_name == 'push'
        run: npm ci

      # With pending changelogs: bump versions and open a "Version Packages" PR.
      # After that PR merges: create the `et@x.y.z` git tag and GitHub release.
      - name: Version & release
        if: github.event_name == 'push'
        run: node scripts/tegami.mts ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Detect released tag
        id: tag
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            if [[ ! "$tag" =~ ^et@[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: $tag" >&2
              exit 1
            fi
            gh release view "$tag" >/dev/null
          else
            tag="$(git tag --points-at HEAD 'et@*' | head -n 1)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Released: $tag"
          else
            echo "No release tag on HEAD, skipping binary build."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}

  binaries:
    needs: release
    if: needs.release.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # prost-build (et-core) requires protoc.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p et --target ${{ matrix.target }}
        env:
          # Ubuntu aarch64's musl GCC otherwise emits libgcc outlined atomics
          # that reference glibc-only __getauxval (jemalloc issue #2782).
          CFLAGS_aarch64_unknown_linux_musl: ${{ matrix.target == 'aarch64-unknown-linux-musl' && '-mno-outline-atomics' || '' }}

      - name: Package
        id: package
        shell: bash
        run: |
          version="${TAG#et@}"
          name="et-${version}-${{ matrix.target }}"
          mkdir "$name"
          case "${{ matrix.target }}" in
            *windows*)
              cp "target/${{ matrix.target }}/release/et.exe" "$name/"
              archive="$name.zip"
              7z a "$archive" "./$name/*"
              ;;
            *)
              cp "target/${{ matrix.target }}/release/et" "$name/"
              # Busybox-style role dispatch: symlinks select the role by argv[0].
              for role in etserver etterminal htm htmd; do
                ln -s et "$name/$role"
              done
              archive="$name.tar.gz"
              tar -czf "$archive" "$name"
              ;;
          esac
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        shell: bash
        run: |
          gh release upload "$TAG" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  homebrew:
    needs: [release, binaries]
    if: needs.release.outputs.tag != '' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: minpeter/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Update formula
        run: |
          version="${TAG#et@}"
          ./scripts/generate-formula.sh "$version" > homebrew-tap/Formula/et-rs.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/et-rs.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "et-rs ${version}"
          git push origin HEAD:main

  aur:
    needs: [release, binaries]
    if: needs.release.outputs.tag != '' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # AUR publishing must not block a release (e.g. AUR maintenance windows).
    continue-on-error: true
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate PKGBUILD
        run: ./scripts/generate-pkgbuild.sh "${TAG#et@}" > ./PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: et-rs-bin
          pkgbuild: ./PKGBUILD
          commit_username: github-actions[bot]
          commit_email: 41898282+github-actions[bot]@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: et-rs-bin ${{ env.TAG }}
